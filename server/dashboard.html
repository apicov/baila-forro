<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pico Forró group</title>
<style>
  :root {
    --bg: #faf8f3; --surface: #ffffff; --text: #2b2b2b; --muted: #6f6a61; --accent: #3d5a80; --divider: #e6e1d6;
    --ok: #3f7a3a; --warn: #b8641f; --chip: #efeadf;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1e1e1e; --surface: #262626; --text: #d6d3cd; --muted: #9a968e; --accent: #8fb3d9; --divider: #363431;
      --ok: #9ccc8a; --warn: #e8a15f; --chip: #33312d; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 Inter, system-ui, -apple-system, sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 16px; }
  h1 { font: 600 22px/1.2 Georgia, serif; margin: 4px 0 16px; }
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
  header h1 { margin: 4px 0; }
  header .actions { margin-left: auto; display: flex; gap: 8px; }
  button, input { font: inherit; color: inherit; }
  button { background: var(--surface); border: 1px solid var(--divider); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  button.on { background: var(--accent); border-color: var(--accent); color: var(--surface); }
  input { background: var(--surface); border: 1px solid var(--divider); border-radius: 8px; padding: 8px 10px; width: 100%; }
  header + .tiles { margin-top: 12px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 8px; margin-bottom: 16px; }
  .tile { background: var(--surface); border: 1px solid var(--divider); border-radius: 10px; padding: 10px 12px; }
  .tile b { display: block; font-size: 24px; font-variant-numeric: tabular-nums; }
  .tile span { color: var(--muted); font-size: 13px; }
  .filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .song { background: var(--surface); border: 1px solid var(--divider); border-radius: 10px; padding: 12px 14px; margin-top: 10px; }
  .song h2 { font-size: 16px; margin: 0 0 6px; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .chip { background: var(--chip); border-radius: 999px; padding: 2px 10px; font-size: 13px; }
  .chip.rhythm { background: var(--accent); color: var(--surface); }
  .ok { color: var(--ok); font-weight: 600; } .warn { color: var(--warn); font-weight: 600; }
  .muted { color: var(--muted); font-size: 13px; }
  .notes { margin: 8px 0 0; padding-left: 18px; }
  details { margin-top: 6px; } summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  table { border-collapse: collapse; margin-top: 6px; font-size: 13px; } td { padding: 2px 10px 2px 0; }
  #login { max-width: 360px; margin: 15vh auto; }
  #login form { display: flex; gap: 8px; margin-top: 12px; }
  .error { color: var(--warn); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <section id="login" hidden>
    <h1>Pico Forró group</h1>
    <div>The group's code (the one in the app's Sharing):</div>
    <form id="login-form"><input id="code" type="password" autocomplete="current-password" aria-label="Group code"><button>Open</button></form>
    <p id="login-error" class="error" hidden></p>
  </section>

  <section id="board" hidden>
    <header><h1>Pico Forró group</h1>
      <span class="actions"><button id="export">Export</button><button id="logout">Log out</button></span>
    </header>
    <div class="tiles" id="tiles"></div>
    <input id="search" type="search" placeholder="Search songs, notes, names" aria-label="Search">
    <div class="filters" id="filters" style="margin-top:10px"></div>
    <div class="muted" id="count"></div>
    <div id="songs"></div>
  </section>
</main>
<script>
const KEY = 'pico-forro-dashboard.code';
const RHYTHM = { 'forró': 'Forró', 'arrasta-pé': 'Arrasta-pé', 'baião': 'Baião', 'xaxado': 'Xaxado' };
const REASON = { steps: 'Steps', rhythm: 'Rhythm', audio: 'Audio' };
const FILTERS = [
  ['all', 'All', () => true],
  ['fix', 'Needs a fix', (s) => s.fix > 0],
  ['norhythm', 'No rhythm', (s) => !Object.keys(s.rhythms).length],
  ['unchecked', 'Not checked', (s) => s.right + s.fix === 0],
  ['disagree', 'People disagree', (s) => s.disagree],
  ['right', 'Looks right', (s) => s.right > 0 && s.fix === 0],
];
let data = null, filter = 'all';
const $ = (id) => document.getElementById(id);
const fold = (t) => t.normalize('NFD').replace(/\p{M}/gu, '').toLowerCase();
function el(tag, attrs = {}, ...kids) { // text goes in as text: names and notes come from people
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  for (const k of kids) if (k != null && k !== false) e.append(k);
  return e;
}
const when = (ms) => new Date(ms).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' });

async function api(path) {
  const res = await fetch(path, { headers: { 'X-Group-Code': localStorage.getItem(KEY) || '' } });
  if (res.status === 401) throw new Error('Wrong group code');
  if (!res.ok) throw new Error(`The server answered ${res.status}`);
  return res.json();
}

async function load() {
  try {
    data = await api('api/summary');
    $('login').hidden = true; $('board').hidden = false;
    render();
  } catch (err) {
    $('board').hidden = true; $('login').hidden = false;
    const e = $('login-error');
    e.hidden = !localStorage.getItem(KEY); e.textContent = err.message;
  }
}

function render() {
  const songs = data.songs;
  const tiles = [
    [songs.length, 'songs'], [songs.filter((s) => s.right + s.fix > 0).length, 'checked'],
    [songs.filter((s) => s.fix > 0).length, 'need a fix'], [songs.filter((s) => Object.keys(s.rhythms).length).length, 'with a rhythm'],
    [data.people, data.people === 1 ? 'person' : 'people'],
  ];
  $('tiles').replaceChildren(...tiles.map(([n, label]) => el('div', { class: 'tile' }, el('b', {}, String(n)), el('span', {}, label))));
  $('filters').replaceChildren(...FILTERS.map(([key, label, f]) => {
    const b = el('button', { class: key === filter ? 'on' : '', 'aria-pressed': String(key === filter) }, `${label} (${songs.filter(f).length})`);
    b.onclick = () => { filter = key; render(); };
    return b;
  }));
  const q = fold($('search').value.trim());
  const test = FILTERS.find(([key]) => key === filter)[2];
  const shown = songs.filter(test).filter((s) => !q || fold([s.title, ...s.votes.flatMap((v) => [v.name, v.note, v.rhythm || ''])].join(' ')).includes(q))
    .sort((a, b) => b.fix - a.fix || b.last - a.last);
  $('count').textContent = `${shown.length} of ${songs.length} songs`;
  $('songs').replaceChildren(...shown.map(card));
}

function card(s) {
  const rhythms = Object.entries(s.rhythms).sort((a, b) => b[1] - a[1]);
  const notes = s.votes.filter((v) => v.note);
  return el('article', { class: 'song' },
    el('h2', {}, s.title),
    el('div', { class: 'row' },
      ...(rhythms.length
        ? rhythms.map(([r, n]) => el('span', { class: r === s.rhythm ? 'chip rhythm' : 'chip' }, `${RHYTHM[r] || r}${rhythms.length > 1 || n > 1 ? ` ${n}` : ''}`))
        : [el('span', { class: 'muted' }, 'no rhythm yet')]),
      s.right ? el('span', { class: 'ok' }, `✓ ${s.right}`) : null,
      s.fix ? el('span', { class: 'warn' }, `⚠ ${s.fix}`) : null,
      ...Object.entries(s.reasons).map(([r, n]) => el('span', { class: 'chip' }, `${REASON[r] || r}${n > 1 ? ` ${n}` : ''}`)),
      s.disagree ? el('span', { class: 'muted' }, '· people disagree') : null,
    ),
    notes.length ? el('ul', { class: 'notes' }, ...notes.map((v) => el('li', {}, el('b', {}, `${v.name}: `), v.note))) : null,
    el('details', {},
      el('summary', {}, `${s.votes.length} ${s.votes.length === 1 ? 'person' : 'people'} · last ${when(s.last)}`),
      el('table', {}, ...s.votes.map((v) => el('tr', {},
        el('td', {}, v.name), el('td', {}, v.rhythm ? RHYTHM[v.rhythm] || v.rhythm : '–'),
        el('td', {}, v.verdict === 'right' ? '✓ looks right' : v.verdict === 'fix' ? `⚠ needs a fix${v.reasons.length ? ` (${v.reasons.map((r) => REASON[r] || r).join(', ')})` : ''}` : '–'),
        el('td', { class: 'muted' }, when(v.at)))))),
  );
}

$('login-form').onsubmit = (e) => { e.preventDefault(); localStorage.setItem(KEY, $('code').value.trim()); load(); };
$('logout').onclick = () => { localStorage.removeItem(KEY); $('code').value = ''; load(); };
$('search').oninput = () => render();
$('export').onclick = async () => {
  const json = await api('api/export');
  const a = el('a', { href: URL.createObjectURL(new Blob([JSON.stringify(json, null, 1)], { type: 'application/json' })),
    download: `pico-forro-tags-${new Date().toISOString().slice(0, 10)}.json` });
  a.click(); URL.revokeObjectURL(a.href);
};
load();
setInterval(() => { if (!$('board').hidden && !document.hidden) load(); }, 60000);
</script>
</body>
</html>
