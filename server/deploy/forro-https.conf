# The dashboard and the app's API (uvicorn :8060)
<VirtualHost *:443>
    ServerName forro.apicov.xyz
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/forro.apicov.xyz/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/forro.apicov.xyz/privkey.pem

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass / http://127.0.0.1:8060/
    ProxyPassReverse / http://127.0.0.1:8060/
    RequestHeader set X-Forwarded-Proto "https"
</VirtualHost>
